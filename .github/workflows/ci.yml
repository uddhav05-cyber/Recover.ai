name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recoverai
          POSTGRES_USER: recoverai
          POSTGRES_PASSWORD: recoverai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recoverai -d recoverai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://recoverai:recoverai@localhost:5432/recoverai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Test backend
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build